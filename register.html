<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumiskin</title><style>@import "tailwindcss";
:root{--bg:#eef0f3;--paper:#fffdf9;--ink:#251b1d;--muted:#75686a;--line:#cfc7c5;--coral:#df744e;--peach:#f0d5c3;--rose:#8b4159}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}p,h1,h2,h3{margin-top:0}button,input{font:inherit}
main{max-width:960px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px var(--line),0 22px 65px rgba(47,32,35,.1);overflow:hidden}.header{min-height:70px;padding:10px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;background:rgba(255,253,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand-logo{width:104px;height:48px;overflow:hidden;border-radius:5px}.brand-logo img{object-fit:cover}.header nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:12px;color:#56494c}.header nav a{position:relative;white-space:nowrap}.header nav a:after{content:"";position:absolute;left:0;right:100%;bottom:-5px;height:2px;background:var(--coral);transition:right .22s}.header nav a:hover:after{right:0}.menu{display:none;border:0;background:none;padding:8px}.menu span{display:block;width:24px;height:1px;background:var(--ink);margin:6px}
section{position:relative;padding:42px 40px;border-bottom:1px solid var(--line)}.image-wrap{overflow:hidden;background:#ddd7d2}.section-heading{text-align:center;margin-bottom:25px}.section-heading h2{margin:0;font-size:clamp(26px,3vw,34px);font-weight:500}.section-label{margin:0 0 10px;color:var(--coral);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero{text-align:center;padding:68px 40px 48px}.hero h1{margin:0 0 15px;font-size:clamp(38px,5.4vw,58px);font-weight:500;line-height:1.15;letter-spacing:-.035em}.hero-lead{max-width:640px;margin:0 auto 30px;color:var(--muted);font-size:16px;line-height:1.9}.hero-image{height:320px;max-width:760px;margin:0 auto}.hero-image img{object-position:center 32%}.hero-description{max-width:700px;margin:25px auto 0;color:var(--muted);font-size:14px;line-height:1.9}
.question{display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:center}.question-copy h2{margin-bottom:20px;font-size:clamp(26px,3.2vw,36px);font-weight:500;line-height:1.35;letter-spacing:-.025em}.question-copy>p{margin-bottom:12px;color:var(--muted);font-size:14px;line-height:1.85}.question-image{height:310px}.question-image img{object-position:center 25%}.stats{display:flex;gap:9px;margin-top:22px}.stats article{flex:1;min-width:0;padding:13px 7px;text-align:center;background:#f2ede8;border-radius:8px}.stats strong{display:block;color:var(--rose);font-size:18px}.stats span{display:block;margin-top:5px;color:var(--muted);font-size:10px}
.businesses{padding-block:46px}.business-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.business-grid article{min-height:220px;padding:20px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:#fff}.business-letter{width:38px;height:38px;display:grid;place-items:center;margin-bottom:22px;border-radius:50%;background:var(--coral);color:#fff;font-size:15px;font-weight:700}.business-grid h3{margin-bottom:8px;font-size:22px;font-weight:500}.business-grid p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.business-result{margin-top:auto;padding-top:15px;border-top:1px solid var(--line);color:#66575a;font-size:12px;line-height:1.6}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.detail-copy h2{margin-bottom:14px;font-size:clamp(28px,3.5vw,40px);font-weight:500;line-height:1.2}.detail-copy h3{margin-bottom:10px;font-size:18px;font-weight:600}.detail-copy>p:not(.section-label){margin-bottom:10px;color:var(--muted);font-size:14px;line-height:1.8}.detail-image{height:300px}.product-note{margin-top:17px;padding:14px;border-left:4px solid var(--coral);background:#f5eee8;color:#6c3b46;font-size:13px;line-height:1.7}.community{background:#f6f1ed}.event-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.event-list article{padding:13px;border:1px solid var(--line);background:#fff}.event-list h3{font-size:14px}.event-list p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.features{display:flex;gap:9px;margin:18px 0}.features article{flex:1;padding:14px 10px;border:1px solid var(--line);border-radius:5px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}.button{display:inline-block;padding:11px 20px;border-radius:7px;background:var(--rose);color:#fff;font-size:13px;font-weight:700;transition:transform .2s,background .2s}.button:hover{transform:translateY(-2px);background:#713247}
.members-section{padding-block:46px}.member-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.member-grid article{text-align:center}.member-photo{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;border:1px solid var(--line)}.member-grid article:first-child .member-photo img{object-position:center 58%}.member-grid article:nth-child(2) .member-photo img{object-position:center 20%}.member-grid article:nth-child(3) .member-photo img{object-position:center 8%}.member-grid h3{margin-bottom:5px;font-size:16px;font-weight:600}.member-role{margin-bottom:10px;color:var(--coral);font-size:12px;font-weight:700}.member-description{color:var(--muted);font-size:11px;line-height:1.7}.awards{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:35px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;line-height:1.5}.awards span{color:var(--coral);font-weight:700}.awards i{width:1px;height:18px;background:var(--line)}
footer{padding:35px 40px;display:flex;justify-content:space-between;align-items:flex-start;gap:28px;background:#f0ebe6}footer p{max-width:480px;margin-bottom:15px;color:var(--muted);font-size:13px;line-height:1.7}.sns-row{display:flex;gap:9px}.sns-row a{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff}.sns-row img{width:17px;height:17px;object-fit:contain;opacity:.75}.contact-box{min-width:230px;padding:23px 18px;border:1px solid #8a7c7f;background:#fff;text-align:center;font-size:13px;transition:background .2s,color .2s}.contact-box:hover{background:var(--rose);color:#fff}
.hero-reveal img{animation:heroPhotoReveal 1.5s cubic-bezier(.2,.75,.2,1) both}.hero-curtain{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#d97b59;animation:heroCurtainOpen 1.5s cubic-bezier(.7,0,.2,1) both}.hero-curtain:before{content:"";position:absolute;width:170px;height:170px;border:1px solid rgba(255,255,255,.55);border-radius:50%;animation:heroRing .8s ease-out both}.hero-curtain span{position:relative;color:#fff7ee;font:italic 700 clamp(48px,8vw,84px)/1 Georgia,serif;letter-spacing:-.06em;animation:heroWord 1.15s ease both}@keyframes heroWord{0%{opacity:0;transform:translateY(16px);filter:blur(7px)}30%,66%{opacity:1;transform:none;filter:none}100%{opacity:0;transform:translateY(-14px);filter:blur(4px)}}@keyframes heroRing{from{opacity:0;transform:scale(.7)}50%{opacity:1}to{opacity:0;transform:scale(1.25)}}@keyframes heroCurtainOpen{0%,66%{opacity:1;clip-path:inset(0)}100%{opacity:0;clip-path:inset(0 0 100%);visibility:hidden}}@keyframes heroPhotoReveal{0%,55%{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
.fullscreen-intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#760020 0%,#5b0018 56%,#35000d 100%);animation:fullscreenOut 3s cubic-bezier(.76,0,.18,1) both}.fullscreen-intro span{grid-area:1/1;color:#f8df8b;text-shadow:0 2px 22px rgba(255,220,118,.16)}.intro-brand{font:italic 700 clamp(72px,15vw,190px)/1 Georgia,serif;letter-spacing:-.07em;animation:introBrand 3s ease both}.intro-message{padding:0 24px;text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;font-size:clamp(32px,5.4vw,68px);font-weight:400;line-height:1.45;letter-spacing:.08em;animation:introMessage 3s ease both}.version-b .hero-curtain{display:none}.version-b .hero-reveal img{animation:none}@keyframes introBrand{0%{opacity:0;transform:translateY(25px);filter:blur(8px)}7%,34%{opacity:1;transform:none;filter:none}43%,to{opacity:0;transform:translateY(-16px);filter:blur(4px)}}@keyframes introMessage{0%,40%{opacity:0;transform:translateY(18px);filter:blur(6px)}48%,84%{opacity:1;transform:none;filter:none}91%,to{opacity:0;transform:translateY(-12px);filter:blur(3px)}}@keyframes fullscreenOut{0%,90%{opacity:1;clip-path:inset(0)}to{opacity:0;clip-path:inset(0 0 100%);visibility:hidden}}
.version-b{width:100%;max-width:none;margin:0;box-shadow:none}.version-b .header,.version-b section,.version-b footer{width:100%;padding-left:clamp(24px,4vw,72px);padding-right:clamp(24px,4vw,72px)}.version-b .hero{padding-top:78px;padding-bottom:60px}.version-b .hero-image{width:100%;max-width:none;height:clamp(400px,48vw,680px)}.version-b .question,.version-b .detail{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(38px,6vw,96px)}.version-b .question-image,.version-b .detail-image{height:clamp(360px,38vw,560px)}.version-b .business-grid{gap:24px}.version-b .business-grid article{min-height:250px;padding:28px}.version-b .member-grid{gap:48px}.version-b footer{padding-top:42px;padding-bottom:42px}
.register-page{min-height:100vh}.register-header{height:70px;padding:10px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.back-link{font-size:13px;color:var(--rose)}.register-shell{min-height:calc(100vh - 70px);padding:55px 48px;display:grid;grid-template-columns:.85fr 1fr;gap:55px;align-items:center;background:#f3efeb}.register-copy h1{font-size:52px;font-weight:500}.register-copy>p{color:var(--muted)}.register-benefits{margin-top:30px;display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center}.register-benefits span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--coral);color:#fff;font-size:12px}.register-benefits p{margin:0;font-size:14px}.register-card{padding:35px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 35px rgba(50,30,35,.08)}.prototype-note{padding:10px;background:#f5eee8;color:#7a4e3f;text-align:center;font-size:12px}.social-auth{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}.social-auth button{min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;font-weight:700}.social-auth .apple-auth{background:#111;color:#fff;border-color:#111}.auth-notice{margin:8px 0;color:var(--rose);text-align:center;font-size:12px}.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:11px}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--line)}.register-card form{display:grid;gap:16px}.register-card label{display:grid;gap:7px;font-size:13px;font-weight:600}.register-card input[type="text"],.register-card input[type="email"],.register-card input[type="password"],.register-card input[type="date"],.register-card select{width:100%;padding:13px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}.confirm-check{display:flex!important;align-items:center;gap:8px!important;font-weight:400!important}.register-submit,.register-complete button{padding:13px 20px;border:0;border-radius:6px;background:var(--rose);color:#fff;font-weight:700}.signin-note{text-align:center;color:var(--muted);font-size:12px}.register-complete{text-align:center}.complete-mark{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:var(--peach);font-size:26px}.register-complete h2{font-size:26px}.register-complete p{color:var(--muted);font-size:13px}.register-complete>a{display:block;margin-top:18px;color:var(--rose);font-size:13px}
@media(max-width:760px){main{max-width:none}.header{min-height:64px;padding:8px 20px}.brand-logo{width:88px;height:43px}.menu{display:block;z-index:61}.header nav{display:none;position:absolute;left:0;right:0;top:63px;padding:22px;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start}.header nav.open{display:flex}section{padding:38px 22px}.hero{padding:52px 22px 38px}.hero-image{height:330px}.question,.detail,.version-b .question,.version-b .detail{grid-template-columns:1fr}.question-image,.detail-image{height:300px}.question-image{grid-row:1}.question-copy{grid-row:2}.community .detail-image{grid-row:1}.community .detail-copy{grid-row:2}.business-grid{grid-template-columns:1fr}.business-grid article{min-height:190px}.member-grid{gap:12px}.member-photo{width:105px;height:105px}.awards{align-items:flex-start;flex-direction:column}.awards i{display:none}footer{padding:30px 22px;flex-direction:column}.contact-box{width:100%}.register-shell{grid-template-columns:1fr;padding:40px 22px}.register-copy h1{font-size:42px}.version-b .header{padding:8px 20px}.version-b section{padding-left:22px;padding-right:22px}.version-b footer{padding:30px 22px}.version-b .hero{padding-top:52px;padding-bottom:38px}.version-b .hero-image{height:330px}.version-b .question-image,.version-b .detail-image{height:300px}.version-b .business-grid{gap:15px}.version-b .business-grid article{min-height:190px;padding:20px}.version-b .member-grid{gap:12px}}
@media(max-width:520px){.hero h1{font-size:36px}.hero-lead{font-size:15px}.stats{gap:5px}.stats strong{font-size:15px}.business-grid h3{font-size:20px}.member-grid{grid-template-columns:1fr}.member-photo{width:140px;height:140px}.member-description{display:block}.event-list{grid-template-columns:1fr}.features{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}.hero-curtain,.fullscreen-intro{display:none}}

.version-b .header{position:absolute;top:0;left:0;right:0;z-index:20;background:transparent;border-bottom:0}.version-b .header .brand-logo{visibility:hidden}.version-b .header nav a{color:#651014}.version-b .hero.hero-poster{position:relative;min-height:100svh;padding:clamp(160px,22vh,240px) clamp(28px,7vw,110px) clamp(58px,9vh,100px);display:flex;align-items:flex-end;text-align:left;background:linear-gradient(to bottom,#f7e5dc 0 7.5%,#651014 7.5% 100%)}.version-b .hero.hero-poster:before{content:"Lumiskin";position:absolute;z-index:2;top:clamp(8px,1.2vw,17px);left:clamp(16px,1.2vw,24px);color:#651014;font:700 clamp(42px,5.1vw,78px)/.9 Georgia,"Times New Roman",serif;letter-spacing:-.045em;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}.hero-poster-copy{position:relative;z-index:2;max-width:720px;color:#fff6ee;text-shadow:0 2px 28px rgba(44,0,8,.22)}.hero-poster-copy .hero-kicker{margin:0 0 14px;font:600 13px/1.2 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}.hero-poster-copy h1{margin:0 0 20px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(42px,6.4vw,88px);line-height:1.13;letter-spacing:.02em}.hero-poster-copy>p:not(.hero-kicker){max-width:620px;margin:0;font-size:clamp(15px,1.5vw,19px);line-height:1.9}.hero-actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:30px}.hero-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 25px;border-radius:999px;font-weight:700;text-decoration:none}.hero-primary{background:#fff5e9;color:#651014}.hero-secondary{border:1px solid rgba(255,245,233,.75);color:#fff5e9;backdrop-filter:none}@media(max-width:760px){.version-b .header nav a{color:var(--ink)}.version-b .hero.hero-poster{min-height:100svh;padding:150px 24px 54px;background:linear-gradient(to bottom,#f7e5dc 0 76px,#651014 76px 100%)}.version-b .hero.hero-poster:before{top:14px;left:18px;font-size:42px}.hero-actions{display:grid}.hero-actions a{width:100%}}
</style></head><body><main class="register-page"><header class="register-header"><a href="index.html" class="brand-logo" aria-label="Lumiskin トップへ戻る"><img src="assets/lumiskin-logo.jpg" alt="Lumiskin"/></a><a class="back-link" href="index.html">← トップへ戻る</a></header><section class="register-shell"><div class="register-copy"><p class="section-label">Lumiskin Member</p><h1>会員登録</h1><p>会員登録は無料です。</p><div class="register-benefits"><span>01</span><p>美容メディアが見られる</p><span>02</span><p>会員様同士のコミュニケーションツール</p></div></div><div class="register-card"><p class="prototype-note">認証接続前：入力情報はまだ保存されません</p><div class="social-auth" aria-label="ソーシャルログイン"><button type="button">Googleで続ける</button><button type="button" class="apple-auth">Appleで続ける</button></div><div class="auth-divider"><span>または</span></div><form><label>名前<input type="text" autoComplete="name" placeholder="例：山田 花子" required="" name="fullName"/></label><label>メールアドレス<input type="email" autoComplete="email" placeholder="example@email.com" required="" name="email"/></label><label>生年月日<input type="date" autoComplete="bday" required="" name="birthDate"/></label><label>性別<select name="gender" required=""><option value="" disabled="" selected="">選択してください</option><option value="female">女性</option><option value="male">男性</option><option value="nonbinary">ノンバイナリー</option><option value="other">その他</option><option value="prefer_not_to_say">回答しない</option></select></label><label>パスワード<input type="password" autoComplete="new-password" placeholder="8文字以上" minLength="8" required="" name="password"/></label><label class="confirm-check"><input type="checkbox" required=""/><span>入力内容を確認しました</span></label><button class="register-submit" type="submit">無料で会員登録する</button></form><p class="signin-note">すでに会員の方　<span>ログイン</span></p></div></section></main><script>
document.querySelectorAll('.menu').forEach(button=>button.addEventListener('click',()=>{
  const nav=button.nextElementSibling; nav.classList.toggle('open');
  button.setAttribute('aria-expanded',nav.classList.contains('open'));
}));
document.querySelectorAll('.social-auth button').forEach(button=>button.addEventListener('click',()=>{
  let notice=document.querySelector('.auth-notice');
  if(!notice){notice=document.createElement('p');notice.className='auth-notice';notice.setAttribute('role','status');document.querySelector('.social-auth').after(notice);}
  notice.textContent=button.classList.contains('apple-auth')?'Appleログインは認証設定後に利用できます':'Googleログインは認証設定後に利用できます';
}));
const form=document.querySelector('.register-card form');
if(form) form.addEventListener('submit',event=>{event.preventDefault();document.querySelector('.register-card').innerHTML='<div class="register-complete" role="status"><div class="complete-mark">✓</div><h2>登録画面の体験が完了しました</h2><p>これは現在、入力情報を保存しない体験版です。</p><a href="index.html">トップへ戻る</a></div>';window.scrollTo({top:0,behavior:'smooth'});});
</script></body></html>
